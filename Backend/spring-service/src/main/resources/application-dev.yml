# Dev profile overrides — do NOT use in production
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: jdbc:postgresql://localhost:5432/medikiosk_dev
    username: medikiosk
    # DB_PASSWORD must still be set via env var — never hardcode

logging:
  level:
    com.medikiosk: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  admin-bootstrap:
    enabled: true
