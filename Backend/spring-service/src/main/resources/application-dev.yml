spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/medikiosk_dev}
    username: ${DB_USERNAME:medikiosk}
    password: ${DB_PASSWORD:medikioskPostGre}

logging:
  level:
    com.medikiosk: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  admin-bootstrap:
    enabled: true